[package]
name = "pdb"
version = "0.8.0"
description = "A parser for Microsoft PDB (Program Database) debugging information"
repository = "https://github.com/willglynn/pdb"
authors = ["Jan Michael Auer <mail@jauer.org>", "Will Glynn <will@willglynn.com>"]
readme = "README.md"
license = "MIT OR Apache-2.0"
edition = "2018"
exclude = [
    "fixtures/*",
    "scripts/*",
]

[dependencies]
fallible-iterator = "0.3.0"
scroll = "0.13.0"
uuid = "1.26.0"
memchr = { version = "2", default-features = false }
chrono = { version = "0.4.45", default-features = false, optional = true }

[features]
default = ["std", "chrono"]
chrono = ["dep:chrono"]
alloc = ["chrono?/alloc"]
std = ["alloc"]
nightly = []

[dev-dependencies]
getopts = "0.2.21"

[package.metadata.release]
pre-release-commit-message = "Release {{version}}"
tag-name = "{{version}}"
tag-message = "Release {{version}}"
dev-version = false
